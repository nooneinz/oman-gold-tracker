<section id="settings" class="my-10 scroll-mt-24 rounded-2xl border border-gold-200/60 bg-[var(--surface)] p-6 shadow-sm dark:border-charcoal-400">
  <div class="mb-6">
    <h2 class="text-xl font-bold text-[var(--text)] sm:text-2xl">{{ 'settings.title' | tr }}</h2>
    <p class="mt-1 text-sm text-[var(--text-muted)]">{{ 'settings.subtitle' | tr }}</p>
  </div>

  <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
    <div class="rounded-xl border border-gold-200/60 p-4 dark:border-charcoal-400">
      <p class="mb-3 text-xs font-bold uppercase tracking-wide text-[var(--text-muted)]">{{ 'settings.appearance' | tr }}</p>
      <div class="inline-flex rounded-full bg-[var(--surface-2)] p-1">
        <button type="button" (click)="setTheme('light')"
          class="rounded-full px-4 py-2 text-xs font-bold transition"
          [ngClass]="(theme$ | async) === 'light' ? 'bg-gold-gradient text-charcoal-800' : 'text-[var(--text-muted)]'">
          {{ 'settings.light' | tr }}
        </button>
        <button type="button" (click)="setTheme('dark')"
          class="rounded-full px-4 py-2 text-xs font-bold transition"
          [ngClass]="(theme$ | async) === 'dark' ? 'bg-gold-gradient text-charcoal-800' : 'text-[var(--text-muted)]'">
          {{ 'settings.dark' | tr }}
        </button>
      </div>
    </div>

    <div class="rounded-xl border border-gold-200/60 p-4 dark:border-charcoal-400">
      <p class="mb-3 text-xs font-bold uppercase tracking-wide text-[var(--text-muted)]">{{ 'settings.language' | tr }}</p>
      <div class="inline-flex rounded-full bg-[var(--surface-2)] p-1">
        <button type="button" (click)="setLang('ar')"
          class="rounded-full px-4 py-2 text-xs font-bold transition"
          [ngClass]="(lang$ | async) === 'ar' ? 'bg-gold-gradient text-charcoal-800' : 'text-[var(--text-muted)]'">
          {{ 'settings.arabic' | tr }}
        </button>
        <button type="button" (click)="setLang('en')"
          class="rounded-full px-4 py-2 text-xs font-bold transition"
          [ngClass]="(lang$ | async) === 'en' ? 'bg-gold-gradient text-charcoal-800' : 'text-[var(--text-muted)]'">
          {{ 'settings.english' | tr }}
        </button>
      </div>
    </div>

    <div class="rounded-xl border border-gold-200/60 p-4 dark:border-charcoal-400">
      <p class="mb-3 text-xs font-bold uppercase tracking-wide text-[var(--text-muted)]">{{ 'settings.currency' | tr }}</p>
      <p class="text-sm font-semibold text-[var(--text)]">{{ 'settings.currencyValue' | tr }}</p>
    </div>

    <div class="rounded-xl border border-gold-200/60 p-4 dark:border-charcoal-400">
      <p class="mb-3 text-xs font-bold uppercase tracking-wide text-[var(--text-muted)]">{{ 'settings.data' | tr }}</p>
      <button type="button" (click)="clearAlerts()"
        class="rounded-full border border-rose-300/60 px-3.5 py-2 text-xs font-semibold text-rose-600 transition hover:bg-rose-50 dark:border-rose-400/30 dark:hover:bg-rose-500/10">
        {{ 'settings.clearAlerts' | tr }}
      </button>
      <span *ngIf="cleared" class="ms-2 text-xs font-semibold text-emerald-600">✓</span>
    </div>
  </div>

  <div class="mt-6 rounded-xl bg-[var(--surface-2)] p-4">
    <p class="mb-1 text-xs font-bold uppercase tracking-wide text-[var(--text-muted)]">{{ 'settings.about' | tr }}</p>
    <p class="text-sm leading-6 text-[var(--text-muted)]">{{ 'settings.aboutText' | tr }}</p>
  </div>
</section>
