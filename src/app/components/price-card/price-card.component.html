<article class="soft-card h-full p-4 transition hover:-translate-y-0.5 sm:p-5">
  <div class="flex items-start justify-between">
    <span class="text-[0.6875rem] font-medium text-muted">عيار {{ card.karat }}</span>
    <img src="assets/images/gold-bars.jpg" alt="" aria-hidden="true" class="h-14 w-14 rounded-full object-cover ring-1 ring-line shadow-card" />
  </div>

  <p class="num mt-3 text-right text-[1.55rem] font-semibold leading-none text-ink sm:text-[1.7rem]">{{ card.pricePerGram | number:'1.3-3' }}</p>
  <p class="mt-1.5 text-right text-[0.625rem] text-muted"><span class="num">OMR</span> / جرام</p>

  <p class="num mt-4 flex items-center justify-end gap-1 text-[0.625rem] font-medium" dir="ltr"
    [style.color]="card.changePercent < 0 ? 'var(--down)' : 'var(--up)'">
    <svg viewBox="0 0 24 24" class="h-3 w-3" fill="currentColor" [class.rotate-180]="card.changePercent < 0"><path d="M12 6 20 17H4Z" /></svg>
    {{ card.changePercent > 0 ? '+' : '' }}{{ card.changePercent | number:'1.2-2' }}%
  </p>
</article>
